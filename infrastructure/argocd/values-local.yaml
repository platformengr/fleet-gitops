# Argo CD Helm values: local profile (kind, laptops, workshops).
# Chart: argo/argo-cd, version pinned in bootstrap/lib/argocd.sh (ARGOCD_CHART_VERSION).
# Single replicas, small requests, no SSO. Not for production: see values-prod.yaml.

global:
  domain: argocd.local

configs:
  params:
    # TLS stays on; reach the UI with `kubectl port-forward svc/argocd-server 8080:443`.
    server.insecure: false
    # Lesson 08 uses ApplicationSet progressive sync (RollingSync) on kind too.
    applicationsetcontroller.enable.progressive.syncs: true
  cm:
    # Report the resource tracking method explicitly; annotation tracking avoids
    # label clashes with Helm charts that set app.kubernetes.io/instance.
    application.resourceTrackingMethod: annotation

dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }

server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }

repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }

applicationSet:
  resources:
    requests: { cpu: 25m, memory: 64Mi }

redis:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
