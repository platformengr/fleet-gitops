{{- $size := include "pn.size" . | fromYaml }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: product-quota
  namespace: {{ include "pn.name" . }}
  labels:
    {{- include "pn.labels" . | nindent 4 }}
spec:
  hard:
    {{- toYaml $size.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: product-defaults
  namespace: {{ include "pn.name" . }}
  labels:
    {{- include "pn.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        {{- toYaml $size.defaultRequest | nindent 8 }}
      default:
        {{- toYaml $size.default | nindent 8 }}
