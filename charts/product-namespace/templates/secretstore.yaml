{{- if .Values.secretStore.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: product-secrets
  namespace: {{ include "pn.name" . }}
  labels:
    {{- include "pn.labels" . | nindent 4 }}
spec:
  provider:
    {{- required "secretStore.provider is required when secretStore.enabled" .Values.secretStore.provider | toYaml | nindent 4 }}
{{- end }}
