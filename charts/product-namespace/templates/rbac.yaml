# The owning team (a group from your identity provider; on kind, impersonate it
# with --as=someone --as-group=<owner>) may manage workloads in its namespace,
# but not the quota, limits or this binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: product-team-edit
  namespace: {{ include "pn.name" . }}
  labels:
    {{- include "pn.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ .Values.product.owner | quote }}
