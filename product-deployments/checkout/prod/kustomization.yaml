# checkout in prod. A pull request touching this folder waits for the
# "production" environment approval before it can merge.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: checkout
resources:
  - ../base
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.7.0
replicas:
  - name: checkout
    count: 2
patches:
  - target:
      kind: Deployment
      name: checkout
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "checkout (prod)"
