# checkout in dev. Merged changes here deploy automatically.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: checkout
resources:
  - ../base
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.7.1
patches:
  - target:
      kind: Deployment
      name: checkout
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "checkout (dev)"
