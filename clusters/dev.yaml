# Fleet inventory: one file per workload cluster. Owned by the platform team.
# Read by Terraform (infrastructure/kind creates every provider: kind entry and
# registers it with Argo CD, labelled from these fields) and by the platform
# ApplicationSets (add-ons, policies, agents per cluster).
name: dev
provider: kind
server: https://dev-control-plane:6443
environment: dev
upgradeWave: "0"
region: local
lokiEndpoint: http://platform-control-plane:31100/loki/api/v1/push
