# Lab 01: one Argo CD Application, one cluster.
# If you forked the repo, change repoURL to your fork (see course/01-gitops-in-one-cluster.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abrahamberg/fleet-gitops.git
    targetRevision: main
    path: course/labs/01-single-app/app
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-hello
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
