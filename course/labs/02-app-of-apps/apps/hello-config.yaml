apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-hello-config
  namespace: argocd
spec:
  project: course-lab
  source:
    repoURL: https://github.com/abrahamberg/fleet-gitops.git
    targetRevision: main
    path: course/labs/02-app-of-apps/workloads/hello-config
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-config
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
