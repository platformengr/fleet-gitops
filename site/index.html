  html += '<ul class="modlist" style="margin-top:10px"><li><button type="button" class="modlink' + (n === MODULES.length ? ' done' : '') + '" data-go="graduation"' + (currentId === 'graduation' ? ' aria-current="page"' : '') + '>' +
    '<span class="modnum"><span>&#9733;</span>' + TICK + '</span><span class="modtitle">Graduation</span></button></li></ul>';
  $('#modnav').innerHTML = html;
  $('#badges').innerHTML = BADGES.map(b => {
    const on = S.badges.includes(b.id);
    return '<div class="badge' + (on ? ' on' : '') + '" role="listitem" tabindex="0" title="' + esc(b.name + ': ' + b.desc) + '" aria-label="' + esc(b.name + (on ? ', unlocked. ' : ', locked. ') + b.desc) + '">' + b.ab + '</div>';
  }).join('');
}
function checkBadges() {
  BADGES.forEach(b => {
    if (!S.badges.includes(b.id) && b.test(S)) { S.badges.push(b.id); toast('Badge unlocked: ' + b.name, ' ' + b.desc); }
  });
  save();
}

/* ------------------------------------------------------------------
   Views
   ------------------------------------------------------------------ */
function trackPickerHTML(name) {
  return '<fieldset class="track-picker"><legend>Choose your track</legend>' + Object.keys(TRACKS).map(k =>
    '<div class="track-opt"><input type="radio" name="' + name + '" id="' + name + '-' + k + '" value="' + k + '"' + (S.track === k ? ' checked' : '') + '>' +
    '<label for="' + name + '-' + k + '"><b>' + esc(TRACKS[k].name) + '</b><span>' + esc(TRACKS[k].blurb) + '</span></label></div>').join('') + '</fieldset>';
}
function firstIncomplete() { const m = MODULES.find((x, i) => !isDone(S, i)); return m ? m.id : 'graduation'; }

function viewHome() {
  const started = doneCount() > 0;
  return '<section class="hero"><div class="hero-grid"><div>' +
    '<p class="eyebrow">Interactive workshop · 12 modules · about 10 hours</p>' +
    '<h1>Go from one kind cluster to a <span class="grad">production-shaped Kubernetes fleet</span> with GitOps</h1>' +
    '<p class="lede">Hands-on, step by step: Argo CD, ApplicationSets, add-ons, tenants, observability, progressive delivery, secrets, and the cloud. Every module levels up the fleet you are building.</p>' +
    trackPickerHTML('hero-track') +
    '<div class="hero-actions"><button class="btn primary" type="button" data-go="' + firstIncomplete() + '">' + (started ? 'Continue where you left off' : 'Start the workshop') +
    ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>' +
    '<a class="btn" href="quickstart.html">Just give me the scripts</a></div>' +
    '</div><div class="hero-art card">' + fleetSVG(upto(11), -1, S.track, { title: 'The fleet you will build: hub, dev and prod spokes, add-ons, tenants, observability, waves, security' }) +
    '<p class="muted" style="font-size:13px;margin:6px 4px 0;text-align:center">What you will have at the end. The sidebar map starts empty.</p></div></div>' +
    '<p class="origin">Where this came from: this course started as a hands-on workshop I ran for <a href="https://www.platformengr.com/" rel="noopener">PlatformEngr</a>. Attendees kept asking for the material, so it is now public. Everything runs from <a href="' + REPO + '" rel="noopener">one Git repo</a>. <span style="white-space:nowrap">Daniel Abrahamberg</span></p>' +
    '<div class="levels-grid">' + LEVELS.map((lv, li) => '<div class="card"><p class="eyebrow">Level ' + (li + 1) + '</p><h3>' + lv + '</h3><ol start="' + MODULES.findIndex(m => m.level === li) + '">' +
      MODULES.filter(m => m.level === li).map(m => '<li><a href="#/m/' + m.id + '">' + esc(m.title) + '</a></li>').join('') + '</ol></div>').join('') + '</div></section>';
}

function viewModule(idx) {
  const m = MODULES[idx], tr = S.track, done = isDone(S, idx);
  const prev = MODULES[idx - 1], next = MODULES[idx + 1];
  let h = '<nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Workshop</a><span aria-hidden="true">/</span><span>Level ' + (m.level + 1) + ' · ' + LEVELS[m.level] + '</span><span aria-hidden="true">/</span><span>Module ' + m.id.slice(0, 2) + '</span></nav>' +
    '<h1 class="mod-h1">' + esc(m.title) + '</h1>' +
    '<div class="meta"><span class="chip">' + esc(m.time) + '</span><span class="chip accent">Track: ' + esc(TRACKS[tr].name) + '</span>' + (done ? '<span class="chip" style="color:var(--ok)">Completed</span>' : '') + '</div>';
  if (m.id === '10-going-to-cloud' && tr === 'kind') h += '<p class="notice">You are on the kind track. This module needs a cloud account; commands show <b>AKS</b>. Switch the track in the header to see EKS or GKE.</p>';
  h += '<div class="goal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg><p><b>Goal.</b> ' + md(m.goal) + '</p></div>';
  h += '<figure class="card diagram-card" style="margin:0">' + fleetSVG(upto(idx), idx, tr, { title: 'Your fleet after this module: ' + fleetSummary(upto(idx)) }) +
    '<figcaption><span>Your fleet after this module</span><b style="color:var(--accent)">' + esc(FLEET_LEVELS[idx + 1]) + '</b></figcaption></figure>';
  h += '<section class="block" aria-labelledby="c-h"><h2 id="c-h">Concepts</h2><div class="concepts">' + m.concepts.map(c => '<div class="card concept"><h3>' + esc(c.t) + '</h3><p>' + md(c.d) + '</p></div>').join('') + '</div></section>';
  h += '<section class="block" aria-labelledby="s-h"><h2 id="s-h">Steps</h2><ol class="steps">' + m.steps.map((st, si) => {
    const key = m.id + ':' + si, checked = !!S.steps[key];
    const c = resolveCmd(st.cmd, tr);
    const forceCloud = m.id === '10-going-to-cloud';
    const text = c ? fill(c.text, tr, forceCloud) : '';
    const note = (tr !== 'kind' && st.cloudNote) ? '<p>' + md(st.cloudNote) + '</p>' : '';
    return '<li class="card step' + (checked ? ' checked' : '') + '">' +
      '<button type="button" class="step-check" data-step="' + key + '" aria-pressed="' + checked + '" aria-label="Mark step ' + (si + 1) + ' done: ' + esc(st.t) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button>' +
      '<h3><span class="muted" style="font-family:var(--mono);font-size:13px">' + (si + 1) + '.</span> ' + esc(st.t) + (c && c.tag ? ' <span class="trk">' + esc(c.tag) + '</span>' : '') + '</h3>' +
      (st.d ? '<p>' + md(st.d) + '</p>' : '') + note + (c ? codeBlock(text, st.t) : '') + '</li>';
  }).join('') + '</ol></section>';
  const b = m.brk, bc = resolveCmd(b.cmd, tr), bdone = !!S.breaks[m.id];
  h += '<section class="block card break" aria-labelledby="b-h"><h2 id="b-h"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>Break it on purpose: ' + esc(b.t) + '</h2>' +
    '<p>' + md(b.d) + '</p>' + (bc ? codeBlock(fill(bc.text, tr, m.id === '10-going-to-cloud'), 'Challenge command') : '') +
    '<details class="fix"><summary>What should happen?</summary><p>' + md(b.fix) + '</p></details>' +
    '<div class="toggle-row"><button type="button" class="btn" data-break="' + m.id + '" aria-pressed="' + bdone + '">' + (bdone ? 'Broken and fixed' : 'I broke it (and fixed it)') + '</button></div></section>';
  h += '<section class="block card" aria-labelledby="q-h"><h2 id="q-h">Quick check</h2>' + m.quiz.map((q, qi) => {
    const st = (S.quiz[m.id] || {})[qi];
    const solved = st && st.solved;
    return '<div class="quiz-q" data-quiz="' + m.id + '" data-q="' + qi + '"><fieldset><legend>' + (qi + 1) + '. ' + md(q.q) + '</legend><div class="opts">' +
      q.o.map((o, oi) => '<button type="button" class="opt' + (solved && oi === q.a ? ' right' : '') + '" data-opt="' + oi + '"' + (solved ? ' disabled' : '') + '>' + md(o) + '</button>').join('') +
      '</div></fieldset><div class="why-slot" aria-live="polite">' + (solved ? '<div class="why good">Correct. <span>' + md(q.why) + '</span></div>' : '') + '</div></div>';
  }).join('') + '</section>';
  h += '<section class="block note" aria-label="Field note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h12l4 4v12H4z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg><p><b>Field note.</b> ' + md(m.note) + '</p></section>';
  h += '<div class="deep"><a class="btn" href="' + courseUrl(m.id) + '" rel="noopener">Deep dive: course/' + m.id + '.md</a><a class="btn" href="quickstart.html">Quickstart scripts</a></div>';
  const stepsDone = m.steps.filter((_, si) => S.steps[m.id + ':' + si]).length;
  h += '<div class="card complete-bar" style="margin-top:24px"><div><b>' + (done ? 'Module complete' : 'Done with this module?') + '</b><div class="muted" style="font-size:14px">' + stepsDone + ' of ' + m.steps.length + ' steps checked · ' + quizScore(m) + ' of 3 quiz answers right</div></div>' +
    '<button type="button" class="btn ' + (done ? '' : 'primary') + '" data-complete="' + m.id + '">' + (done ? 'Mark as not done' : 'Complete module') + '</button></div>';
  h += '<nav class="pager" aria-label="Module navigation">' +
    (prev ? '<a class="btn prev" href="#/m/' + prev.id + '"><span aria-hidden="true">&larr;</span><span class="t"><small>Previous</small>' + esc(prev.title) + '</span></a>' : '<a class="btn prev" href="#/"><span aria-hidden="true">&larr;</span><span class="t"><small>Back</small>Overview</span></a>') +
    (next ? '<a class="btn next" href="#/m/' + next.id + '"><span class="t"><small>Next</small>' + esc(next.title) + '</span><span aria-hidden="true">&rarr;</span></a>' : '<a class="btn next primary" href="#/graduation"><span class="t"><small style="color:inherit">Finish</small>Graduation</span><span aria-hidden="true">&rarr;</span></a>') +
    '</nav><p class="kbd-hint">Tip: <kbd>j</kbd> / <kbd>&rarr;</kbd> next module, <kbd>k</kbd> / <kbd>&larr;</kbd> previous.</p>';
  return h;
}
function quizScore(m) { const q = S.quiz[m.id] || {}; return m.quiz.filter((_, i) => q[i] && q[i].solved).length; }

function viewGraduation() {
  const n = doneCount(), all = n === MODULES.length;
  const correct = MODULES.reduce((a, m) => a + quizScore(m), 0);
  const d = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  let h = '<div class="grad-hero"><p class="eyebrow">Graduation</p><h1>' + (all ? 'You now have a near-prod fleet' : 'Almost there: ' + n + ' of ' + MODULES.length + ' modules') + '</h1>' +
    '<p class="muted" style="max-width:620px;margin:0 auto">' + (all ? 'A hub running Argo CD, dev and prod spokes, add-ons, tenant guardrails, central logs, upgrade waves, external secrets, SSO and a rebuild-from-Git drill. All described in one repo.' : 'Finish the remaining modules to complete the fleet. Here is what you have built so far.') + '</p></div>';
  h += '<figure class="card diagram-card" style="margin:0">' + fleetSVG(all ? upto(11) : completedSet(), -1, S.track, { title: 'Your fleet: ' + fleetSummary(completedSet()) }) + '<figcaption><span>Your fleet · track ' + esc(TRACKS[S.track].name) + '</span><b style="color:var(--accent)">' + esc($('#fleetLevel').textContent) + '</b></figcaption></figure>';
  h += '<div class="stats"><div class="card stat"><b>' + n + '/12</b><span>modules completed</span></div><div class="card stat"><b>' + correct + '/36</b><span>quiz answers right</span></div><div class="card stat"><b>' + S.badges.length + '/' + BADGES.length + '</b><span>badges unlocked</span></div></div>';
  h += '<section class="block" aria-labelledby="cert-h"><h2 id="cert-h">Your certificate</h2>' +
    '<div class="name-row"><label class="sr-only" for="certName">Your name</label><input id="certName" type="text" autocomplete="name" placeholder="Type your name for the certificate" value="' + esc(S.name || '') + '" maxlength="80">' +
    '<button type="button" class="btn" id="printCert">Print or save as PDF</button></div>' +
    '<div class="cert" id="cert"><p class="eyebrow">Certificate of completion</p><h2>This certifies that</h2><div class="who" id="certWho">' + esc(S.name || 'Your Name') + '</div>' +
    '<p>completed <b>Fleet GitOps: from one cluster to a production-shaped fleet</b></p><p class="muted">' + n + ' of 12 modules · ' + esc(TRACKS[S.track].name) + ' track · ' + esc(d) + '</p>' +
    '<div class="sig"><div>Daniel Abrahamberg, course author</div><div>Self-paced · ' + esc(REPO.replace('https://', '')) + '</div></div></div>' +
    '<p class="muted" style="font-size:13px">Generated in your browser. Nothing is sent anywhere.</p></section>';
  h += '<section class="block card" aria-labelledby="pc-h"><h2 id="pc-h">Between you and real production</h2><p class="muted" style="margin-top:0">The repo is production-shaped, not production. This is the list I would work through with a team.</p><ul class="checklist">' +
    PROD_CHECKLIST.map((c, i) => '<li><label><input type="checkbox" data-prod="' + i + '"' + (S.prod[i] ? ' checked' : '') + '><span>' + esc(c[0]) + '<small>' + esc(c[1]) + '</small></span></label></li>').join('') + '</ul></section>';
  h += '<div class="deep"><a class="btn primary" href="quickstart.html">Generate your bootstrap scripts</a><a class="btn" href="' + REPO + '" rel="noopener">Star or fork the repo</a><a class="btn" href="' + REPO + '/tree/main/course" rel="noopener">Read the full course</a></div>';
  h += '<div class="two-col" style="margin-top:24px"><div class="card author"><div class="avatar" aria-hidden="true">DA</div><div><h3>About the author</h3><p>Daniel Abrahamberg builds Kubernetes platforms and teaches platform engineering. This material grew out of a workshop he ran for PlatformEngr.</p>' +
    '<div class="links-row"><a href="https://www.abrahamberg.com/" rel="noopener">Blog</a><a href="https://github.com/abrahamberg" rel="noopener">GitHub</a><a href="https://www.linkedin.com/in/abrahamberg/" rel="noopener">LinkedIn</a></div></div></div>' +
    '<div class="card"><h3 style="margin:0 0 6px;font-size:16px">Found a gap?</h3><p class="muted" style="margin:0 0 8px;font-size:14px">Issues and pull requests are welcome. If a step did not work on your track, that is a bug in the course, not in you.</p><a href="' + REPO + '/issues" rel="noopener">Open an issue</a></div></div>';
  h += '<p class="quiet">Want help taking this to production for your team? PlatformEngr runs this workshop and helps teams build platforms. <a href="https://www.platformengr.com/contact/" rel="noopener">Get in touch</a>.</p>';
  return h;
}

/* ------------------------------------------------------------------
   Router & events
   ------------------------------------------------------------------ */
let current = 'home';
function route() {
  const hash = location.hash.replace(/^#\/?/, '');
  const view = $('#view');
  let id = 'home';
  if (hash.startsWith('m/')) {
    const mid = hash.slice(2), idx = MODULES.findIndex(m => m.id === mid);
    if (idx >= 0) { id = mid; view.innerHTML = viewModule(idx); }
    else view.innerHTML = viewHome();
  } else if (hash === 'graduation') { id = 'graduation'; view.innerHTML = viewGraduation(); }
  else view.innerHTML = viewHome();
  const changed = id !== current;
  current = id;
  renderSidebar(id);
  closeNav();
  if (changed) { window.scrollTo(0, 0); $('#main').focus({ preventScroll: true }); }
  document.title = id === 'home' ? 'Fleet GitOps Workshop' : id === 'graduation' ? 'Graduation · Fleet GitOps Workshop' : MODULES.find(m => m.id === id).title + ' · Fleet GitOps Workshop';
}
function rerender() { const y = window.scrollY; const prevCur = current; current = '__'; route(); current = prevCur; window.scrollTo(0, y); }
function go(id) { location.hash = id === 'home' ? '#/' : id === 'graduation' ? '#/graduation' : '#/m/' + id; }
function setTrack(t) {
  if (!TRACKS[t] || t === S.track) return;
  S.track = t; save(); $('#trackSelect').value = t;
  rerender();
  toast('Track: ' + TRACKS[t].name, ' Commands now show ' + TRACKS[t].label + ' variants.');
}
function closeNav() { document.body.classList.remove('nav-open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-copy],[data-step],[data-break],[data-opt],[data-complete],#printCert');
  if (!t) return;
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.hasAttribute('data-copy')) { copyText(t.parentElement.querySelector('pre').innerText, t); return; }
  if (t.dataset.step) {
    S.steps[t.dataset.step] = !S.steps[t.dataset.step]; save();
    const li = t.closest('.step'); li.classList.toggle('checked', S.steps[t.dataset.step]); t.setAttribute('aria-pressed', String(!!S.steps[t.dataset.step]));
    const idx = MODULES.findIndex(m => m.id === current), m = MODULES[idx];
    if (m && m.steps.every((_, si) => S.steps[m.id + ':' + si]) && !isDone(S, idx)) toast('All steps checked', ' Finish the quiz and complete the module.');
    return;
  }
  if (t.dataset.break) {
    S.breaks[t.dataset.break] = !S.breaks[t.dataset.break]; save();
    t.textContent = S.breaks[t.dataset.break] ? 'Broken and fixed' : 'I broke it (and fixed it)'; t.setAttribute('aria-pressed', String(!!S.breaks[t.dataset.break]));
    checkBadges(); renderSidebar(current); return;
  }
  if (t.dataset.opt != null) {
    const box = t.closest('.quiz-q'), mid = box.dataset.quiz, qi = +box.dataset.q;
    const m = MODULES.find(x => x.id === mid), q = m.quiz[qi], pick = +t.dataset.opt;
    S.quiz[mid] = S.quiz[mid] || {};
    const st = S.quiz[mid][qi] || {};
    if (st.first === undefined) st.first = pick === q.a;
    const slot = box.querySelector('.why-slot');
    if (pick === q.a) {
      st.solved = true;
      box.querySelectorAll('.opt').forEach(o => { o.disabled = true; o.classList.remove('wrong'); });
      t.classList.add('right');
      slot.innerHTML = '<div class="why good">Correct. <span>' + md(q.why) + '</span></div>';
    } else {
      t.classList.remove('wrong'); void t.offsetWidth; t.classList.add('wrong');
      slot.innerHTML = '<div class="why bad">Not quite. Try again.</div>';
    }
    S.quiz[mid][qi] = st; save();
    if (m.quiz.every((_, i) => S.quiz[mid][i] && S.quiz[mid][i].solved) && pick === q.a) toast(quizPerfect(S, mid) ? 'Perfect quiz' : 'Quiz done', quizPerfect(S, mid) ? ' 3 of 3 on the first try.' : ' All three answered.');
    const bar = $('.complete-bar .muted'); if (bar) bar.textContent = m.steps.filter((_, si) => S.steps[m.id + ':' + si]).length + ' of ' + m.steps.length + ' steps checked · ' + quizScore(m) + ' of 3 quiz answers right';
    checkBadges(); renderSidebar(current); return;
  }
  if (t.dataset.complete) {
    const mid = t.dataset.complete, idx = MODULES.findIndex(m => m.id === mid);
    const was = !!S.done[mid];
    S.done[mid] = !was; save();
    if (!was) {
      confetti();
      toast('Module ' + mid.slice(0, 2) + ' complete', ' Your fleet levelled up: ' + FLEET_LEVELS[idx + 1] + '.');
      $('.ring').animate && !reduceMotion() && $('.ring').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 500 });
    }
    checkBadges();
    if (!was && doneCount() === MODULES.length) { setTimeout(() => go('graduation'), 900); }
    rerender(); return;
  }
  if (t.id === 'printCert') { window.print(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'hero-track') setTrack(t.value);
  if (t.id === 'trackSelect') setTrack(t.value);
  if (t.dataset && t.dataset.prod != null) { S.prod[t.dataset.prod] = t.checked; save(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'certName') { S.name = e.target.value; save(); $('#certWho').textContent = S.name.trim() || 'Your Name'; }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (e.key === 'Escape') { closeNav(); return; }
  const order = ['home'].concat(MODULES.map(m => m.id), ['graduation']);
  const i = order.indexOf(current);
  if (e.key === 'j' || e.key === 'ArrowRight') { if (i < order.length - 1) { e.preventDefault(); go(order[i + 1]); } }
  else if (e.key === 'k' || e.key === 'ArrowLeft') { if (i > 0) { e.preventDefault(); go(order[i - 1]); } }
});
$('#menuBtn').addEventListener('click', () => {
  const open = !document.body.classList.contains('nav-open');
  document.body.classList.toggle('nav-open', open); $('#menuBtn').setAttribute('aria-expanded', String(open));
});
$('#scrim').addEventListener('click', closeNav);
$('#themeBtn').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next); S.theme = next; save();
});
$('#resetBtn').addEventListener('click', () => {
  if (!confirm('Reset all progress, quiz answers and badges? Your track and theme are kept.')) return;
  const keep = { track: S.track, theme: S.theme };
  S = Object.assign(freshState(), keep); save(); rerender(); toast('Progress reset', ' Fresh fleet, same track.');
});
window.addEventListener('hashchange', route);

/* Init */
$('#trackSelect').innerHTML = Object.keys(TRACKS).map(k => '<option value="' + k + '">' + esc(TRACKS[k].name) + '</option>').join('');
$('#trackSelect').value = S.track;
$('#repoLink').href = REPO;
document.querySelectorAll('.repoLink2').forEach(a => { a.href = REPO; });
route();
</script>
