<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet GitOps Workshop</title>
<meta name="description" content="An interactive, hands-on workshop: go from one kind cluster to a production-shaped Kubernetes fleet with Argo CD and GitOps. Tracks for kind, AKS, EKS and GKE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
  // Set theme before paint to avoid a flash.
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem('fleet-workshop-v1') || '{}').theme || null; } catch (e) {}
    if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
:root, :root[data-theme="dark"] {
  --bg: #0b1020; --surface: #121a2e; --surface-2: #1a2440; --text: #e6ebf5; --muted: #9aa7c2;
  --accent: #5eead4; --accent-2: #a78bfa; --warn: #fbbf24; --ok: #34d399; --danger: #f87171;
  --line: rgba(154,167,194,.22); --line-strong: rgba(154,167,194,.4);
  --accent-soft: rgba(94,234,212,.12); --accent-2-soft: rgba(167,139,250,.14); --warn-soft: rgba(251,191,36,.12);
  --danger-soft: rgba(248,113,113,.12); --ok-soft: rgba(52,211,153,.12);
  --code-bg: #0a0f1d; --on-accent: #062a26; --shadow: 0 10px 30px rgba(0,0,0,.35);
  --radius: 14px; --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f7f8fc; --surface: #ffffff; --surface-2: #eef1f8; --text: #0f172a; --muted: #55607a;
  --accent: #0d9488; --accent-2: #7c3aed; --warn: #b45309; --ok: #047857; --danger: #b91c1c;
  --line: rgba(15,23,42,.12); --line-strong: rgba(15,23,42,.25);
  --accent-soft: rgba(13,148,136,.1); --accent-2-soft: rgba(124,58,237,.09); --warn-soft: rgba(180,83,9,.09);
  --danger-soft: rgba(185,28,28,.08); --ok-soft: rgba(4,120,87,.1);
  --code-bg: #0f172a; --on-accent: #ffffff; --shadow: 0 10px 30px rgba(15,23,42,.08);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .88em; background: var(--surface-2); padding: .1em .4em; border-radius: 6px; overflow-wrap: anywhere; }
h1, h2, h3 { line-height: 1.2; letter-spacing: -.02em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--on-accent); padding: 8px 12px; border-radius: 8px; z-index: 100; }
.skip:focus { left: 8px; }

/* Header */
.topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; text-decoration: none; color: var(--text); white-space: nowrap; }
.brand-mark { width: 28px; height: 28px; flex: none; }
.topnav { display: flex; gap: 4px; margin-left: 8px; }
.topnav a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.topnav a:hover, .topnav a[aria-current="page"] { color: var(--text); background: var(--surface-2); }
.spacer { flex: 1; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; min-width: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; }
.iconbtn:hover { border-color: var(--line-strong); }
.iconbtn svg { width: 18px; height: 18px; }
.track-select { height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 0 8px; font: inherit; font-size: 14px; }
#menuBtn { display: none; }

/* Layout */
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 57px); }
.sidebar { border-right: 1px solid var(--line); background: var(--surface); padding: 18px 16px 24px; position: sticky; top: 57px; height: calc(100vh - 57px); overflow-y: auto; }
main { min-width: 0; padding: 32px 32px 64px; }
.wrap { max-width: 880px; margin: 0 auto; }

/* Sidebar */
.progress-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.ring { width: 64px; height: 64px; flex: none; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bgc { stroke: var(--surface-2); }
.ring .fgc { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { fill: var(--text); font-size: 15px; font-weight: 700; font-family: var(--font); }
.progress-label strong { display: block; font-size: 15px; }
.progress-label span { color: var(--muted); font-size: 13px; }
.minimap { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin-bottom: 6px; }
.minimap-cap { font-size: 12px; color: var(--muted); margin: 0 0 16px; display: flex; justify-content: space-between; gap: 8px; }
.minimap-cap b { color: var(--accent); font-weight: 600; }
.lvl { margin: 14px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.modlist { list-style: none; margin: 0; padding: 0; }
.modlink { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 8px; border-radius: 10px; border: 0; background: transparent; cursor: pointer; font-size: 14px; color: var(--text); }
.modlink:hover { background: var(--surface-2); }
.modlink[aria-current="page"] { background: var(--accent-soft); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.modnum { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; font-family: var(--mono); background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.modlink.done .modnum { background: var(--ok); color: var(--on-accent); border-color: transparent; }
.modlink.done .modnum span { display: none; }
.modlink .tick { display: none; width: 14px; height: 14px; }
.modlink.done .tick { display: block; }
.modtitle { flex: 1; min-width: 0; }
.badges { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
.badge { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; border: 1px dashed var(--line-strong); color: var(--muted); font-size: 11px; font-weight: 800; font-family: var(--mono); position: relative; cursor: help; opacity: .55; }
.badge.on { opacity: 1; border: 1px solid transparent; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); }
.side-foot { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--danger); }

/* Generic cards & bits */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
.muted { color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer; text-decoration: none; font-size: 15px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn svg { width: 18px; height: 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.accent { color: var(--accent); background: var(--accent-soft); border-color: transparent; }

/* Hero */
.hero { padding: 24px 0 8px; }
.hero h1 { font-size: clamp(30px, 5vw, 48px); margin: 8px 0 14px; font-weight: 800; }
.hero h1 .grad { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lede { font-size: 18px; color: var(--muted); max-width: 640px; margin: 0 0 24px; }
.track-picker { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin: 12px 0 20px; border: 0; padding: 0; }
.track-picker legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.track-opt { position: relative; }
.track-opt input { position: absolute; opacity: 0; inset: 0; pointer-events: none; }
.track-opt label { display: block; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; height: 100%; }
.track-opt label b { display: block; font-size: 16px; }
.track-opt label span { font-size: 13px; color: var(--muted); }
.track-opt input:checked + label { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
.track-opt input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.hero-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 28px; align-items: center; }
.hero-art { padding: 12px; }
.origin { margin-top: 28px; padding: 14px 16px; border-left: 3px solid var(--accent-2); background: var(--accent-2-soft); border-radius: 0 12px 12px 0; font-size: 14px; color: var(--muted); }
.levels-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-top: 28px; }
.levels-grid .card { padding: 16px; }
.levels-grid h3 { margin: 4px 0 8px; font-size: 16px; }
.levels-grid ol { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }

/* Module */
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mod-h1 { font-size: clamp(26px, 4vw, 38px); margin: 6px 0 10px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.goal { display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft); border: 1px solid transparent; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 20px; }
.goal svg { flex: none; width: 22px; height: 22px; color: var(--accent); margin-top: 2px; }
.goal p { margin: 0; }
section.block { margin: 32px 0; }
section.block > h2 { font-size: 20px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
.diagram-card { padding: 14px; }
.diagram-card .fleet { max-width: 620px; margin: 0 auto; }
.diagram-card figcaption { font-size: 13px; color: var(--muted); padding: 6px 6px 0; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.concepts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.concept { padding: 16px; }
.concept h3 { font-size: 15px; margin: 0 0 6px; color: var(--accent); }
.concept p { margin: 0; font-size: 14px; color: var(--muted); }
.steps { list-style: none; padding: 0; margin: 0; counter-reset: step; }
.step { position: relative; padding: 16px 16px 16px 56px; margin-bottom: 12px; }
.step.checked { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.step-check { position: absolute; left: 14px; top: 16px; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line-strong); background: var(--bg); cursor: pointer; display: grid; place-items: center; padding: 0; }
.step-check svg { width: 16px; height: 16px; opacity: 0; transform: scale(.4); transition: .2s; color: var(--on-accent); }
.step.checked .step-check { background: var(--ok); border-color: var(--ok); }
.step.checked .step-check svg { opacity: 1; transform: scale(1); }
.step h3 { font-size: 16px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.step p { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
.trk { font-size: 11px; font-family: var(--mono); padding: 1px 7px; border-radius: 6px; background: var(--accent-2-soft); color: var(--accent-2); font-weight: 600; }
.code { position: relative; background: var(--code-bg); border-radius: 12px; border: 1px solid rgba(154,167,194,.18); margin: 8px 0 0; }
.code pre { margin: 0; padding: 14px 16px; padding-right: 76px; overflow-x: auto; font-family: var(--mono); font-size: 13.5px; line-height: 1.6; color: #e6ebf5; tab-size: 2; }
.code pre .c { color: #7c8aa8; }
.code .copy { position: absolute; top: 8px; right: 8px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(154,167,194,.3); background: #1a2440; color: #e6ebf5; font-size: 12px; cursor: pointer; font-family: var(--font); }
.code .copy:hover { border-color: #5eead4; }
.code .copy.ok { background: #34d399; color: #062a26; border-color: transparent; }
.break { border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: linear-gradient(180deg, var(--danger-soft), transparent 70%), var(--surface); }
.break h2 { color: var(--danger); }
.break .fix { margin-top: 12px; font-size: 14px; }
.break .fix summary { cursor: pointer; font-weight: 600; color: var(--text); }
.toggle-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; flex-wrap: wrap; }
.quiz-q { margin-bottom: 18px; }
.quiz-q fieldset { border: 0; padding: 0; margin: 0; }
.quiz-q legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 15px; line-height: 1.45; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); animation: shake .35s; }
.opt[disabled] { cursor: default; }
.why { font-size: 14px; margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.why.good { color: var(--ok); }
.why.bad { color: var(--danger); }
.why span { color: var(--muted); }
.note { display: flex; gap: 14px; padding: 16px 18px; border-radius: var(--radius); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.note svg { flex: none; width: 22px; height: 22px; color: var(--warn); margin-top: 2px; }
.note p { margin: 0; }
.note b { color: var(--warn); }
.deep { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.complete-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; padding: 18px 20px; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.pager .btn { flex: 1 1 200px; justify-content: space-between; }
.pager .btn small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.pager .btn .t { text-align: left; min-width: 0; }
.pager .next .t { text-align: right; margin-left: auto; }
.kbd-hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 18px; }
kbd { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface-2); }
.notice { padding: 12px 16px; border-radius: 12px; background: var(--accent-2-soft); font-size: 14px; margin-bottom: 18px; }

/* Fleet SVG */
.fleet { width: 100%; height: auto; display: block; }
.fleet text { font-family: var(--font); fill: var(--text); }
.fleet .t-muted { fill: var(--muted); }
.fleet .mono { font-family: var(--mono); }
.fleet .node { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.2; }
.fleet .hubbox { fill: var(--surface-2); stroke: var(--accent); stroke-width: 1.6; }
.fleet .spoke { fill: var(--surface-2); stroke: var(--accent-2); stroke-width: 1.4; }
.fleet .ghost { fill: none; stroke: var(--line-strong); stroke-dasharray: 5 5; }
.fleet .tile { fill: var(--accent); }
.fleet .tile2 { fill: var(--accent); opacity: .65; }
.fleet .proj { fill: none; stroke: var(--accent); stroke-dasharray: 3 3; opacity: .7; }
.fleet .link { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.fleet .flow { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 6 5; animation: flow 1.4s linear infinite; }
.fleet .pipe { fill: none; stroke: var(--accent-2); stroke-width: 1.8; stroke-dasharray: 2 6; stroke-linecap: round; animation: flow 1s linear infinite; }
.fleet .chipr { fill: var(--bg); stroke: var(--line-strong); }
.fleet .chipt { font-size: 8.5px; font-family: var(--mono); fill: var(--text); }
.fleet .ten { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 3 2; }
.fleet .wave { fill: var(--warn-soft); stroke: var(--warn); }
.fleet .wavet { fill: var(--warn); font-size: 8.5px; font-weight: 700; font-family: var(--mono); }
.fleet .lock { fill: var(--ok); }
.fleet .lockbg { fill: var(--bg); stroke: var(--ok); stroke-width: 1.2; }
.fleet .prov { fill: var(--accent-2); }
.fleet .provt { fill: var(--on-accent); font-size: 8.5px; font-weight: 800; font-family: var(--mono); }
.fleet .bar-bg { fill: var(--bg); stroke: var(--line); }
.fleet .bar { fill: var(--warn); animation: canary 4s ease-in-out infinite; transform-box: fill-box; transform-origin: left; }
.fleet .seal { fill: url(#sealgrad); }
.fleet .hi { animation: pop .7s cubic-bezier(.2,1.4,.4,1) both, glow 2.4s ease-in-out .7s 2; transform-box: fill-box; transform-origin: center; }
.fleet .empty { font-size: 13px; fill: var(--muted); }
@keyframes flow { to { stroke-dashoffset: -22; } }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes glow { 50% { filter: drop-shadow(0 0 6px var(--accent)); } }
@keyframes canary { 0% { transform: scaleX(.2); } 35% { transform: scaleX(.2); } 50% { transform: scaleX(.5); } 75% { transform: scaleX(.5); } 90%, 100% { transform: scaleX(1); } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* Graduation */
.grad-hero { text-align: center; padding: 8px 0 12px; }
.grad-hero h1 { font-size: clamp(28px, 5vw, 44px); margin: 6px 0 10px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin: 18px 0; }
.stat { text-align: center; padding: 16px; }
.stat b { display: block; font-size: 28px; color: var(--accent); }
.stat span { font-size: 13px; color: var(--muted); }
.cert { position: relative; padding: 36px 28px; text-align: center; border-radius: 18px; background: var(--surface); border: 2px solid transparent; background-image: linear-gradient(var(--surface), var(--surface)), linear-gradient(135deg, var(--accent), var(--accent-2)); background-origin: border-box; background-clip: padding-box, border-box; }
.cert .eyebrow { letter-spacing: .2em; }
.cert h2 { font-size: 15px; font-weight: 500; color: var(--muted); margin: 14px 0 4px; }
.cert .who { font-size: clamp(26px, 5vw, 40px); font-weight: 800; margin: 4px 0 6px; min-height: 1.2em; overflow-wrap: anywhere; }
.cert p { margin: 6px 0; }
.cert .sig { display: flex; justify-content: space-between; gap: 16px; margin-top: 26px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.cert .sig div { border-top: 1px solid var(--line-strong); padding-top: 6px; min-width: 160px; flex: 1; }
.name-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
.name-row input { flex: 1 1 220px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text); padding: 0 14px; font: inherit; }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); cursor: pointer; font-size: 15px; }
.checklist input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.checklist small { display: block; color: var(--muted); font-size: 13px; }
.author { display: flex; gap: 16px; align-items: flex-start; }
.avatar { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); }
.author h3 { margin: 0 0 4px; font-size: 16px; }
.author p { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.links-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
.quiet { font-size: 14px; color: var(--muted); text-align: center; margin: 28px auto 0; max-width: 560px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

footer.site { border-top: 1px solid var(--line); padding: 20px 16px; text-align: center; font-size: 13px; color: var(--muted); }
footer.site a { color: var(--muted); }

/* Toast + confetti */
.toasts { position: fixed; bottom: 16px; right: 16px; left: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 60; pointer-events: none; }
.toast { pointer-events: auto; max-width: 360px; background: var(--surface); border: 1px solid var(--accent); box-shadow: var(--shadow); border-radius: 12px; padding: 12px 14px; font-size: 14px; animation: toastin .35s ease both; }
.toast b { color: var(--accent); display: block; }
@keyframes toastin { from { opacity: 0; transform: translateY(12px); } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 55; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translate3d(var(--dx), 105vh, 0) rotate(var(--rot)); opacity: .9; } }
.scrim { display: none; }

/* Responsive */
@media (max-width: 1100px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-art { order: -1; max-width: 520px; }
  .levels-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 900px) {
  #menuBtn { display: inline-flex; }
  .topnav { display: none; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; top: 57px; left: 0; bottom: 0; height: auto; width: min(320px, 88vw); z-index: 45; transform: translateX(-102%); transition: transform .25s ease; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 57px 0 0 0; background: rgba(0,0,0,.4); z-index: 44; }
  main { padding: 20px 16px 48px; }
  .track-picker { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .levels-grid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr; }
  .brand-text { display: none; }
  .step { padding: 14px 12px 14px 50px; }
  .step-check { left: 12px; }
  .code pre { font-size: 12.5px; }
  .cert { padding: 28px 16px; }
}
.mobile-nav { display: none; }
@media (max-width: 900px) { .mobile-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 0; font-size: 14px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
@media print {
  body * { visibility: hidden; }
  .cert, .cert * { visibility: visible; }
  .cert { position: absolute; left: 0; top: 0; width: 100%; border-color: #0d9488; }
  .topbar, .sidebar { display: none; }
}

<script>
'use strict';
/* ==================================================================
   Config: change REPO when the repository moves (e.g. to platformengr).
   ================================================================== */
const REPO = 'https://github.com/abrahamberg/fleet-gitops';
const STORE_KEY = 'fleet-workshop-v1';
const sh = String.raw;

const TRACKS = {
  kind: { label: 'kind', name: 'kind (local)', blurb: 'Free, on your laptop. Docker + kind.', hub: 'kind-platform', dev: 'kind-dev', prod: 'kind-prod' },
  aks:  { label: 'AKS',  name: 'Azure AKS', blurb: 'az CLI. Workload identity + Key Vault.', hub: 'fleet-hub', dev: 'fleet-dev', prod: 'fleet-prod' },
  eks:  { label: 'EKS',  name: 'AWS EKS', blurb: 'eksctl + aws CLI. IRSA / Pod Identity.', hub: 'fleet-hub', dev: 'fleet-dev', prod: 'fleet-prod' },
  gke:  { label: 'GKE',  name: 'Google GKE', blurb: 'gcloud CLI. GKE Workload Identity.', hub: 'fleet-hub', dev: 'fleet-dev', prod: 'fleet-prod' }
};

const LEVELS = ['Foundations', 'Fleet', 'Platform', 'Production'];

/* Fleet level names: what the fleet "is" after each module. */
const FLEET_LEVELS = ['Empty repo', 'Forked repo', 'Single cluster', 'Self-managing hub', 'Hub + 2 spokes', 'Generated fleet',
  'Add-ons everywhere', 'Tenant-ready', 'Observable', 'Progressive', 'Locked down', 'Cloud fleet', 'Near-prod fleet'];

/* ------------------------------------------------------------------
   Course content. Commands: a string, or an object keyed by track
   (kind / aks / eks / gke) with an optional `cloud` fallback for all
   three clouds. Placeholders: {HUB} {DEV} {PROD} {CLOUD}.
   ------------------------------------------------------------------ */
const MODULES = [
{
  id: '00-welcome', level: 0, title: 'Welcome', time: '15 min',
  goal: 'Know what you are building, pick a track, and get your tools and your own fork of the repo ready.',
  concepts: [
    { t: 'A fleet', d: 'A set of clusters managed from one control point. Here: one hub running Argo CD, plus dev and prod spokes.' },
    { t: 'Git is the interface', d: 'You will change the fleet by committing YAML, not by running kubectl against prod. Commands in this course are mostly for looking.' },
    { t: 'Four levels', d: 'Foundations, Fleet, Platform, Production. Each module adds one capability to the fleet in the sidebar.' },
    { t: 'Pick a track', d: 'kind runs everything locally for free. AKS, EKS and GKE use bootstrap/<cloud>/up.sh. You can switch any time from the header.' }
  ],
  steps: [
    { t: 'Fork and clone the repo', d: 'Fork it on GitHub first. Argo CD reads from Git, so it needs a repo you can push to.',
      cmd: sh`git clone https://github.com/YOUR_USER/fleet-gitops.git
cd fleet-gitops` },
    { t: 'Check your tools', d: 'Everything below should print a version. Install whatever is missing before you go on.',
      cmd: {
        kind: sh`docker version --format '{{.Server.Version}}'
kind version
kubectl version --client
helm version --short
argocd version --client --short`,
        aks: sh`az version --output table
kubectl version --client
helm version --short
argocd version --client --short`,
        eks: sh`aws --version
eksctl version
kubectl version --client
helm version --short
argocd version --client --short`,
        gke: sh`gcloud version
gke-gcloud-auth-plugin --version
kubectl version --client
helm version --short
argocd version --client --short`
      } },
    { t: 'Take the tour', d: 'Skim the layout. Each folder becomes one or more modules in this course.',
      cmd: sh`ls clusters applicationsets addons requests charts examples
cat clusters/dev.yaml` }
  ],
  brk: { t: 'Predict before you touch', d: 'Before you change anything: open `clusters/dev.yaml` and guess which ApplicationSets read it. Write the list down. You will check your guess in module 04.',
    cmd: sh`grep -l "clusters/\*.yaml" applicationsets/*.yaml`,
    fix: 'Most of them. That is the point of the inventory: one small file per cluster drives almost everything.' },
  quiz: [
    { q: 'Where does Argo CD run in this course?', o: ['On every cluster', 'On the hub (platform) cluster only', 'On your laptop'], a: 1, why: 'Hub-and-spoke: one Argo CD on the hub manages the dev and prod spokes remotely.' },
    { q: 'Why fork the repo instead of just cloning it?', o: ['Forks are faster to clone', 'Argo CD needs a Git repo you can push to, because Git is how you change the fleet', 'GitHub requires it'], a: 1, why: 'You will make changes by committing. Argo CD pulls them from your fork.' },
    { q: 'Which folder describes the clusters in the fleet?', o: ['clusters/', 'charts/', 'examples/'], a: 0, why: 'clusters/*.yaml is the inventory: name, server, environment, upgradeWave, region, lokiEndpoint.' }
  ],
  note: 'In the workshop, the people who got the most out of the day forked first and pushed real commits from minute one. Read-only cloning teaches you half of GitOps.'
},
{
  id: '01-gitops-in-one-cluster', level: 0, title: 'GitOps in one cluster', time: '45 min',
  goal: 'Install Argo CD on one cluster, deploy one Application from Git, and watch it undo a manual change.',
  concepts: [
    { t: 'Declarative', d: 'You describe the end state (YAML), not the steps to get there.' },
    { t: 'Versioned', d: 'That state lives in Git, so every change has an author, a diff and a revert.' },
    { t: 'Pulled', d: 'An agent inside the platform (Argo CD) pulls from Git. CI never needs cluster credentials.' },
    { t: 'Reconciled', d: 'Argo CD keeps comparing live state with Git and fixes the difference. That is self-heal.' }
  ],
  steps: [
    { t: 'Create the hub cluster',
      d: 'This is the cluster that will run Argo CD and, later, manage everything else.',
      cmd: { kind: sh`kind create cluster --name platform
kubectl config use-context kind-platform`,
        cloud: sh`cp bootstrap/{CLOUD}/env.example bootstrap/{CLOUD}/env
$EDITOR bootstrap/{CLOUD}/env          # PREFIX, REGION, K8S_VERSION, NODE_SIZE ...
bash bootstrap/{CLOUD}/up.sh --dry-run # read what it will do first
bash bootstrap/{CLOUD}/up.sh` },
      cloudNote: 'Cloud track: up.sh creates hub, dev and prod in one go and installs Argo CD on the hub. In this module we only look at the hub; module 03 explains the rest. Clusters cost money while they run.' },
    { t: 'Install Argo CD with Helm',
      d: 'The same chart and local values file the bootstrap scripts use, so nothing here is throwaway.',
      cmd: { kind: sh`helm repo add argo https://argoproj.github.io/argo-helm
helm repo update
helm upgrade --install argocd argo/argo-cd \
  --kube-context kind-platform -n argocd --create-namespace \
  -f bootstrap/argocd/values-local.yaml --wait`,
        cloud: sh`# up.sh already installed Argo CD on the hub. Verify:
kubectl --context fleet-hub -n argocd get pods` } },
    { t: 'Open the UI',
      d: 'Keep the port-forward running in its own terminal, then open https://localhost:8080 and log in as admin. (We get rid of the admin password in module 09.)',
      cmd: sh`kubectl --context {HUB} -n argocd get secret argocd-initial-admin-secret \
  -o jsonpath='{.data.password}' | base64 -d; echo
kubectl --context {HUB} -n argocd port-forward svc/argocd-server 8080:443` },
    { t: 'Create your first Application',
      d: 'One Application: "make namespace guestbook on this cluster look like that folder in Git". Automated sync with prune and selfHeal.',
      cmd: sh`kubectl --context {HUB} apply -f - <<'EOF'
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
EOF` },
    { t: 'Watch it sync',
      d: 'Wait for Synced / Healthy. Then find it in the UI and click around the resource tree.',
      cmd: sh`kubectl --context {HUB} -n argocd get application guestbook -w` }
  ],
  brk: { t: 'Cause drift on purpose', d: 'Scale the deployment to zero by hand, as if someone "just fixed something" in prod. Watch what Argo CD does.',
    cmd: sh`kubectl --context {HUB} -n guestbook scale deploy guestbook-ui --replicas=0
kubectl --context {HUB} -n guestbook get deploy guestbook-ui -w`,
    fix: 'Within moments the replica count goes back to what Git says. That is selfHeal. If you want a manual change to stick, the only way is a commit.' },
  quiz: [
    { q: 'What does selfHeal: true do?', o: ['Restarts crashing pods', 'Reverts live changes that differ from Git', 'Rolls back a bad commit automatically'], a: 1, why: 'selfHeal reconciles drift back to Git. It does not judge whether Git itself is right.' },
    { q: 'In pull-based GitOps, who needs credentials to the cluster?', o: ['Your CI pipeline', 'Every developer', 'Only the in-cluster agent (Argo CD)'], a: 2, why: 'Argo CD pulls. CI only needs to write to Git, which shrinks the blast radius of a leaked CI secret.' },
    { q: 'What does prune: true add?', o: ['Deletes resources that were removed from Git', 'Deletes old ReplicaSets', 'Garbage-collects images'], a: 0, why: 'Without prune, deleting a manifest from Git leaves the live object behind.' }
  ],
  note: 'The #1 snag in the workshop was a port-forward that died silently. If the UI stops loading, check the port-forward terminal before you debug Argo CD.'
},
{
  id: '02-app-of-apps', level: 0, title: 'App of apps', time: '30 min',
  goal: 'Bootstrap the whole platform from one root Application, and put a project boundary around what it creates.',
  concepts: [
    { t: 'Root Application', d: '`root-app.yaml` points at the `applicationsets/` folder. Everything else in the repo is reached from there.' },
    { t: 'Bootstrap once', d: 'One `kubectl apply` by a human. After that, every change goes through Git, including changes to the root itself.' },
    { t: 'AppProject boundary', d: '`fleet-platform` limits which repos and destinations generated apps may use. A typo cannot deploy to a random cluster.' },
    { t: 'Declarative all the way', d: 'ApplicationSets are just more YAML in Git, synced by the root. Delete one by hand and it comes back.' }
  ],
  steps: [
    { t: 'Point the repo at your fork',
      d: 'The manifests reference the upstream repo URL. Rewrite it to your fork and push, or Argo CD will happily sync from someone else\'s Git.',
      cmd: sh`scripts/set-repo-url.sh https://github.com/YOUR_USER/fleet-gitops.git
git diff --stat
git commit -am "Point Argo CD at my fork" && git push` },
    { t: 'Read the root', d: 'Short on purpose: path `applicationsets`, automated sync with prune and selfHeal.',
      cmd: sh`cat root-app.yaml
cat applicationsets/fleet-platform-project.yaml` },
    { t: 'Apply it (the only manual apply in the course)',
      cmd: sh`kubectl --context {HUB} apply -f root-app.yaml` },
    { t: 'See what it created',
      d: 'On kind, spoke apps will show errors until module 03 registers dev and prod. That is expected.',
      cmd: sh`kubectl --context {HUB} -n argocd get applications,applicationsets,appprojects` }
  ],
  brk: { t: 'Delete an ApplicationSet by hand', d: 'Delete `wave-demo` directly in the cluster. Who wins: you, or Git?',
    cmd: sh`kubectl --context {HUB} -n argocd delete applicationset wave-demo
kubectl --context {HUB} -n argocd get applicationset wave-demo -w`,
    fix: 'The root Application notices the missing object and recreates it. To really remove it, delete the file in Git.' },
  quiz: [
    { q: 'What does the root Application point at?', o: ['The clusters/ folder', 'The applicationsets/ folder', 'A Helm chart'], a: 1, why: 'root-app.yaml syncs applicationsets/, which then generates everything else.' },
    { q: 'Why have an AppProject like fleet-platform?', o: ['It makes sync faster', 'It restricts allowed source repos and destinations for the apps in it', 'It is required for Helm'], a: 1, why: 'Projects are your guardrail against a generated app deploying somewhere it should not.' },
    { q: 'How do you change the root Application after bootstrap?', o: ['kubectl edit', 'Commit to Git', 'Argo CD UI only'], a: 1, why: 'Even the root is reconciled. Manual edits drift and get reverted.' }
  ],
  note: 'I keep the root app in the default project and everything it generates in a scoped project. That is what this repo does with fleet-platform, and it has saved me from more than one copy-paste mistake.'
},
{
  id: '03-fleet-inventory', level: 1, title: 'Fleet inventory', time: '45 min',
  goal: 'Add dev and prod spoke clusters, register them with the hub declaratively, and describe them in clusters/*.yaml.',
  concepts: [
    { t: 'Hub and spoke', d: 'The hub runs Argo CD. Spokes only run workloads and add-ons. One place to look, one place to secure.' },
    { t: 'Cluster Secret', d: 'Argo CD knows a cluster through a Secret labelled `argocd.argoproj.io/secret-type: cluster`. Declarative, with labels like `fleet.gitops/environment`.' },
    { t: 'Inventory file', d: '`clusters/<name>.yaml` holds name, server, environment, upgradeWave, region and lokiEndpoint. Adding a cluster = adding a file.' },
    { t: 'Git files generator', d: 'ApplicationSets read every `clusters/*.yaml` and turn each field into a template parameter.' }
  ],
  steps: [
    { t: 'Create the spokes',
      cmd: { kind: sh`kind create cluster --name dev
kind create cluster --name prod
kubectl config get-contexts | grep kind-`,
        cloud: sh`# up.sh created them in module 01:
kubectl config get-contexts | grep fleet-` } },
    { t: 'Write the inventory',
      d: 'The server field must be the address the hub can reach.',
      cmd: { kind: sh`DEV_API="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' dev-control-plane)"
PROD_API="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' prod-control-plane)"
sed -i "s#^server:.*#server: https://$DEV_API:6443#" clusters/dev.yaml
sed -i "s#^server:.*#server: https://$PROD_API:6443#" clusters/prod.yaml
git commit -am "Inventory: local kind endpoints" && git push`,
        cloud: sh`# up.sh wrote the API endpoints into the inventory. Review and push:
git diff clusters/
cat clusters/dev.yaml clusters/prod.yaml
git commit -am "Inventory: {CLOUD} endpoints" && git push` } },
    { t: 'Register the spokes with the hub',
      d: 'register_spoke creates a ServiceAccount on the spoke and a declarative cluster Secret on the hub, with environment labels.',
      cmd: { kind: sh`source bootstrap/lib/common.sh
source bootstrap/lib/argocd.sh
# Pass the Docker-network API address: the hub cannot reach 127.0.0.1 of another kind cluster.
register_spoke kind-platform kind-dev dev dev "https://$DEV_API:6443" 0
register_spoke kind-platform kind-prod prod prod "https://$PROD_API:6443" 1`,
        cloud: sh`# up.sh already registered dev and prod. Nothing to do here.` } },
    { t: 'Verify the hub sees the fleet',
      cmd: sh`kubectl --context {HUB} -n argocd get secrets \
  -l argocd.argoproj.io/secret-type=cluster --show-labels
kubectl --context {HUB} -n argocd get applications` },
    { t: 'Shortcut for next time', d: 'Everything in modules 01 to 03 is scripted. Use it to rebuild quickly, after you have done it by hand once.',
      cmd: { kind: sh`bash bootstrap/kind/up.sh   # down: bash bootstrap/kind/down.sh`,
        cloud: sh`bash bootstrap/{CLOUD}/up.sh   # down: bash bootstrap/{CLOUD}/down.sh` } }
  ],
  brk: { t: 'Point the inventory at nowhere', d: 'Push a wrong port for dev and watch every dev-* Application lose its cluster. Then fix it the GitOps way.',
    cmd: sh`sed -i 's#:6443#:6999#' clusters/dev.yaml
git commit -am "oops: wrong dev port" && git push
kubectl --context {HUB} -n argocd get applications | grep '^dev-'
git revert --no-edit HEAD && git push`,
    fix: 'Apps targeting an unknown server fail with "cluster not found". The fix is a revert commit, which also leaves a record of what happened.' },
  quiz: [
    { q: 'What makes a Secret a cluster registration for Argo CD?', o: ['Its name starts with cluster-', 'The label argocd.argoproj.io/secret-type: cluster', 'It lives in kube-system'], a: 1, why: 'Argo CD discovers clusters by that label. Everything else (server, config) is in the Secret data.' },
    { q: 'How do you add a third cluster to the fleet in this repo?', o: ['Edit every ApplicationSet', 'Add clusters/<name>.yaml and register the cluster', 'Copy the dev overlay'], a: 1, why: 'The Git files generator picks up new inventory files automatically.' },
    { q: 'On kind, why not use the 127.0.0.1 server from your kubeconfig?', o: ['It is slower', 'The hub runs in its own container and cannot reach your laptop\'s localhost', 'Argo CD rejects loopback addresses'], a: 1, why: 'The hub needs the spoke\'s address on the docker network.' }
  ],
  note: 'On kind, the #1 snag was the server field: people pasted the 127.0.0.1 URL from their kubeconfig. The hub needs the address it can reach, which is the container IP on the docker network.'
},
{
  id: '04-applicationsets', level: 1, title: 'ApplicationSets', time: '45 min',
  goal: 'Read the generators that turn inventory into Applications, and predict what gets created before Argo CD does.',
  concepts: [
    { t: 'List and Git generators', d: 'List: inline elements. Git files: one element per matching file. Both produce parameters for a template.' },
    { t: 'Matrix generator', d: 'Cartesian product: clusters × add-ons, or clusters × namespace requests. This is where fleets get their leverage.' },
    { t: 'Selectors', d: 'Filter generated elements by field values, e.g. only clusters with `upgradeWave: "0"`.' },
    { t: 'goTemplate and naming', d: '`goTemplate: true` gives you `{{ .name }}` with real Go templates. Name apps `<cluster>-<thing>` so lists sort usefully.' }
  ],
  steps: [
    { t: 'List the ApplicationSets', cmd: sh`kubectl --context {HUB} -n argocd get applicationsets` },
    { t: 'See every generated Application and where it goes',
      cmd: sh`kubectl --context {HUB} -n argocd get applications \
  -o custom-columns=NAME:.metadata.name,DEST:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status` },
    { t: 'Read a simple Git generator', d: 'One Application per cluster file, named `{{name}}-guestbook`.',
      cmd: sh`cat applicationsets/guestbook-appset.yaml` },
    { t: 'Read a matrix generator', d: 'Clusters × namespace requests, with goTemplate.',
      cmd: sh`sed -n '1,45p' applicationsets/tenant-namespaces-appset.yaml` },
    { t: 'Read a selector', cmd: sh`grep -n -A4 'selector' applicationsets/wave-demo-appset.yaml` }
  ],
  brk: { t: 'Make a selector match nothing', d: 'Change the wave-demo selector to a wave that does not exist and push. Watch what happens to the generated apps.',
    cmd: sh`sed -i 's#upgradeWave: "0"#upgradeWave: "9"#' applicationsets/wave-demo-appset.yaml
git commit -am "oops: wave 9" && git push
kubectl --context {HUB} -n argocd get applications | grep wave-demo
git revert --no-edit HEAD && git push`,
    fix: 'The apps disappear, and with them their workloads. Generators can delete. In production consider `syncPolicy.preserveResourcesOnDeletion` and `applicationsSync: create-update` on risky sets.' },
  quiz: [
    { q: 'Clusters × add-ons is which generator?', o: ['List', 'Matrix', 'SCM provider'], a: 1, why: 'Matrix combines two generators: one element per pair.' },
    { q: 'You add clusters/staging.yaml. What happens to guestbook-fleet?', o: ['Nothing until you edit the ApplicationSet', 'It generates staging-guestbook', 'It fails validation'], a: 1, why: 'The Git files generator matches clusters/*.yaml, so a new file is a new element.' },
    { q: 'Why turn on goTemplate with missingkey=error?', o: ['It is faster', 'A typo in a parameter fails loudly instead of rendering an empty string', 'It enables Helm'], a: 1, why: 'Silent empty strings are how apps end up with the wrong name or destination.' }
  ],
  note: 'I turn on goTemplate with missingkey=error for every new ApplicationSet. Silent empty strings are how you end up deploying to the wrong place.'
},
{
  id: '05-addons-and-sync-waves', level: 1, title: 'Add-ons and sync waves', time: '60 min',
  goal: 'Roll out the same platform add-ons to every spoke, vary them per environment, and install them in the right order.',
  concepts: [
    { t: 'Helm add-ons via matrix', d: 'cert-manager, ingress-nginx, argo-rollouts, external-secrets, metrics-server, kube-prometheus-stack and kyverno, each pinned, on every cluster.' },
    { t: 'Base and overlays', d: 'Kustomize `base/` holds what is shared; `overlays/dev` and `overlays/prod` hold the differences. Prod gets quotas, dev does not.' },
    { t: 'Sync waves', d: '`argocd.argoproj.io/sync-wave` orders resources: CRD providers first (cert-manager wave 1), their users later.' },
    { t: 'ServerSideApply', d: 'Large CRDs exceed the client-side annotation limit. `ServerSideApply=true` avoids that and plays nicer with other controllers.' }
  ],
  steps: [
    { t: 'See the add-on list and waves', cmd: sh`grep -nE 'addon:|targetRevision:|syncWave:' applicationsets/platform-helm-addons-appset.yaml` },
    { t: 'Check they landed on a spoke',
      cmd: sh`kubectl --context {DEV} get pods -A | grep -E 'cert-manager|ingress|kyverno|rollouts|external-secrets|metrics-server'` },
    { t: 'Diff dev and prod overlays',
      cmd: sh`kubectl kustomize addons/kyverno-policies/overlays/dev  > /tmp/dev.yaml
kubectl kustomize addons/kyverno-policies/overlays/prod > /tmp/prod.yaml
diff /tmp/dev.yaml /tmp/prod.yaml` },
    { t: 'Find ServerSideApply', cmd: sh`grep -rn ServerSideApply applicationsets/` }
  ],
  brk: { t: 'Pin a chart version that does not exist', d: 'Bump metrics-server to 9.9.9 and push. Read the error Argo CD gives you, then revert.',
    cmd: sh`sed -i 's#targetRevision: 3.12.1#targetRevision: 9.9.9#' applicationsets/platform-helm-addons-appset.yaml
git commit -am "oops: metrics-server 9.9.9" && git push
kubectl --context {HUB} -n argocd get applications | grep metrics-server
git revert --no-edit HEAD && git push`,
    fix: 'You get a ComparisonError on every cluster at once. That is the flip side of fleet leverage, and why module 08 adds waves and module 11 adds CI checks.' },
  quiz: [
    { q: 'Why does cert-manager get an earlier sync wave than things that use Certificates?', o: ['It is smaller', 'Its CRDs must exist before resources that use them', 'Waves are alphabetical'], a: 1, why: 'Applying a Certificate before the CRD exists fails. Lower waves sync first.' },
    { q: 'Where would a prod-only ResourceQuota go?', o: ['base/', 'overlays/prod/', 'In the ApplicationSet template'], a: 1, why: 'Per-environment differences live in overlays. base/ is shared.' },
    { q: 'What problem does ServerSideApply solve here?', o: ['Huge CRDs exceeding the last-applied annotation size', 'Slow Helm rendering', 'Missing namespaces'], a: 0, why: 'Client-side apply stores the full object in an annotation, which breaks for large CRDs.' }
  ],
  note: 'In the workshop, the first "it\'s stuck" moment was almost always ordering: something used a CRD before its operator was installed. Sync waves plus a retry policy fix it; guessing does not.'
},
{
  id: '06-tenants-and-guardrails', level: 2, title: 'Tenants and guardrails', time: '60 min',
  goal: 'Let a team request a namespace with a tiny YAML file, and have the platform attach the guardrails automatically.',
  concepts: [
    { t: 'Namespace request', d: '`requests/namespaces/<name>.yaml`: name, environments, owner, labels, pod security level. That is the whole interface.' },
    { t: 'Tenant chart', d: '`charts/tenant-namespace` turns the request into a Namespace with the right labels. Teams never touch it.' },
    { t: 'Kyverno does the rest', d: 'Policies react to labels: default NetworkPolicy, Pod Security labels, LimitRanges, and quotas in prod.' },
    { t: 'PR review and CODEOWNERS', d: 'A namespace is a pull request. CODEOWNERS makes the platform team a required reviewer.' }
  ],
  steps: [
    { t: 'Read an existing request', cmd: sh`cat requests/namespaces/product-a.yaml` },
    { t: 'Request a new namespace',
      cmd: sh`cat > requests/namespaces/product-b.yaml <<'EOF'
namespace:
  name: product-b
  env:
    - dev
    - prod
  owner: team-b
  requestedBy: team-b
  labels:
    - product-group-b
  policies:
    podSecurity: restricted
  purpose: workshop tenant
EOF
git add requests/namespaces/product-b.yaml
git commit -m "Request namespace product-b" && git push` },
    { t: 'Watch the matrix generate it', cmd: sh`kubectl --context {HUB} -n argocd get applications | grep tenant-product-b` },
    { t: 'Inspect the guardrails',
      cmd: sh`kubectl --context {DEV} get ns product-b --show-labels
kubectl --context {DEV}  -n product-b get networkpolicy,limitrange
kubectl --context {PROD} -n product-b get networkpolicy,limitrange,resourcequota` },
    { t: 'Make the platform team a required reviewer',
      cmd: sh`mkdir -p .github
cat >> .github/CODEOWNERS <<'EOF'
/requests/namespaces/  @YOUR_ORG/platform-team
/applicationsets/      @YOUR_ORG/platform-team
/clusters/             @YOUR_ORG/platform-team
EOF
git add .github/CODEOWNERS && git commit -m "CODEOWNERS for platform paths" && git push` }
  ],
  brk: { t: 'Run a privileged pod in a restricted namespace', d: 'Try to sneak a privileged container into product-b.',
    cmd: sh`kubectl --context {DEV} -n product-b run sneaky --image=nginx \
  --overrides='{"spec":{"containers":[{"name":"sneaky","image":"nginx","securityContext":{"privileged":true}}]}}'`,
    fix: 'Rejected by Pod Security admission ("restricted"). The guardrail came from a label the team never had to know about.' },
  quiz: [
    { q: 'What does a team write to get a namespace?', o: ['A Namespace manifest plus Kyverno policies', 'A small request file under requests/namespaces/', 'A ticket to the platform team'], a: 1, why: 'The request file is the interface; the chart and Kyverno handle the implementation.' },
    { q: 'Where does the prod-only ResourceQuota come from?', o: ['The team writes it', 'Kyverno policies from the prod overlay', 'Kubernetes defaults'], a: 1, why: 'addons/kyverno-policies/overlays/prod includes the quota policy.' },
    { q: 'What does CODEOWNERS add to this flow?', o: ['Faster syncs', 'A required reviewer for platform-owned paths', 'Encryption'], a: 1, why: 'Git review is your change approval process. CODEOWNERS makes it enforceable with branch protection.' }
  ],
  note: 'The request file is the product. Teams do not care about Kyverno; they care that one PR gets them a namespace. Keep that file boring and small, and resist adding fields.'
},
{
  id: '07-observability', level: 2, title: 'Observability', time: '45 min',
  goal: 'Ship logs from every spoke to Loki on the hub, see them in one Grafana, and keep metrics local per cluster.',
  concepts: [
    { t: 'Alloy on every spoke', d: 'Generated per cluster from the inventory, with `cluster` and `environment` labels added to every log line.' },
    { t: 'Loki + Grafana on the hub', d: 'Deployed once to `https://kubernetes.default.svc`, not per cluster. One place to search.' },
    { t: 'Metrics stay local', d: 'kube-prometheus-stack runs on each spoke with its Grafana disabled. Add Mimir and remote-write when you outgrow it.' },
    { t: 'Reachability', d: 'Spokes must reach the hub\'s Loki. On kind that is the docker network; in cloud a private load balancer, ingress or peering.' }
  ],
  steps: [
    { t: 'Look at the endpoint each spoke pushes to', cmd: sh`grep lokiEndpoint clusters/*.yaml` },
    { t: 'Make Loki reachable from the spokes',
      d: 'The sample uses a cluster-local DNS name, which only resolves inside the hub. Expose the Loki gateway (e.g. `gateway.service.type: NodePort`, `nodePort: 31000` in applicationsets/platform-observability.yaml on kind, or an internal load balancer in cloud) and set lokiEndpoint to that address.',
      cmd: { kind: sh`HUB_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' platform-control-plane)"
sed -i "s#^lokiEndpoint:.*#lokiEndpoint: http://$HUB_IP:31000/loki/api/v1/push#" clusters/*.yaml
git commit -am "Point Alloy at hub Loki" && git push`,
        cloud: sh`kubectl --context fleet-hub -n observability get svc loki-gateway
# set lokiEndpoint in clusters/*.yaml to the internal LB / ingress address, then:
git commit -am "Point Alloy at hub Loki" && git push` } },
    { t: 'Check agents and backends',
      cmd: sh`kubectl --context {DEV} -n observability-agents get pods
kubectl --context {HUB} -n observability get pods` },
    { t: 'Query logs from both clusters in one place',
      d: 'Open http://localhost:3000, go to Explore, pick Loki, and run `{cluster="dev"}` then `{environment="prod"}`.',
      cmd: sh`kubectl --context {HUB} -n observability get secret grafana -o jsonpath='{.data.admin-password}' | base64 -d; echo
kubectl --context {HUB} -n observability port-forward svc/grafana 3000:80` }
  ],
  brk: { t: 'Cut the log pipe', d: 'Point prod at a host that does not exist and read the agent logs.',
    cmd: sh`sed -i "s#^lokiEndpoint:.*#lokiEndpoint: http://nowhere.invalid/loki/api/v1/push#" clusters/prod.yaml
git commit -am "oops: break prod logs" && git push
kubectl --context {PROD} -n observability-agents logs -l app.kubernetes.io/name=alloy --tail=20
git revert --no-edit HEAD && git push`,
    fix: 'Alloy logs DNS/connection errors and Grafana goes quiet for prod. Alert on missing data, not just on errors, or you will not notice this in real life.' },
  quiz: [
    { q: 'Why does Grafana run only on the hub?', o: ['It is required by Loki', 'One place to search the whole fleet', 'Spokes cannot run Grafana'], a: 1, why: 'A single pane of glass; spokes just ship data.' },
    { q: 'Why does the sample lokiEndpoint not work across clusters?', o: ['Wrong port', 'cluster.local DNS only resolves inside the cluster that owns the Service', 'Loki needs TLS'], a: 1, why: 'Each cluster has its own cluster.local. You need an address reachable from the spokes.' },
    { q: 'How does a log line tell you which cluster it came from?', o: ['It cannot', 'Alloy adds cluster and environment labels from the inventory', 'Pod names are unique'], a: 1, why: 'The observability ApplicationSet templates those labels from clusters/*.yaml.' }
  ],
  note: 'In the workshop, observability is where cross-cluster networking stops being theoretical. If you only remember one thing: design the hub-to-spoke and spoke-to-hub paths on day one, not after the first incident.'
},
{
  id: '08-progressive-delivery', level: 2, title: 'Progressive delivery', time: '60 min',
  goal: 'Roll changes out dev first, prod second, and canary inside a cluster, with promotion as a Git change.',
  concepts: [
    { t: 'Upgrade waves', d: '`upgradeWave` in the inventory (dev "0", prod "1") plus generator selectors decide which clusters get a change first.' },
    { t: 'Argo Rollouts canary', d: 'The guestbook Rollout shifts 20%, pauses, 50%, pauses, then 100%. A bad version can be aborted mid-way.' },
    { t: 'RollingSync', d: 'ApplicationSet progressive sync: update generated apps in steps (dev, then prod) instead of all at once.' },
    { t: 'Promotion via Git', d: 'Promoting is a PR that widens a selector or bumps a version for the next wave. Reviewable, revertable.' }
  ],
  steps: [
    { t: 'See who is in which wave',
      cmd: sh`grep upgradeWave clusters/*.yaml
kubectl --context {HUB} -n argocd get applications | grep wave-demo   # only dev, wave 0` },
    { t: 'Promote wave-demo to wave 1',
      d: 'Replace the matchLabels selector in applicationsets/wave-demo-appset.yaml with this, then commit and push.',
      cmd: sh`      selector:
        matchExpressions:
          - key: upgradeWave
            operator: In
            values: ["0", "1"]` },
    { t: 'Ship a canary on dev',
      d: 'Change the image from blue to yellow and watch traffic shift. Needs the kubectl argo rollouts plugin.',
      cmd: sh`sed -i 's#rollouts-demo:blue#rollouts-demo:yellow#' examples/guestbook-rollout/rollout.yaml
git commit -am "guestbook: yellow" && git push
kubectl argo rollouts --context {DEV} -n guestbook get rollout guestbook --watch` },
    { t: 'Turn on progressive syncs (RollingSync)',
      d: 'Prefer setting this in bootstrap/argocd/values-*.yaml; the patch shows the knob. Then add a `strategy: { type: RollingSync, rollingSync: { steps: [...] } }` to an ApplicationSet, stepping on an environment label.',
      cmd: sh`kubectl --context {HUB} -n argocd patch cm argocd-cmd-params-cm --type merge \
  -p '{"data":{"applicationsetcontroller.enable.progressive.syncs":"true"}}'
kubectl --context {HUB} -n argocd rollout restart deploy argocd-applicationset-controller` }
  ],
  brk: { t: 'Ship a broken image and abort', d: 'Push an image tag that does not exist. The canary stalls at 20%; abort it, then fix Git.',
    cmd: sh`sed -i 's#rollouts-demo:yellow#rollouts-demo:does-not-exist#' examples/guestbook-rollout/rollout.yaml
git commit -am "oops: bad image" && git push
kubectl argo rollouts --context {DEV} -n guestbook get rollout guestbook
kubectl argo rollouts --context {DEV} -n guestbook abort guestbook
git revert --no-edit HEAD && git push`,
    fix: 'Only the canary pods break; the stable version keeps serving. Abort stops the rollout, the revert makes Git match reality again.' },
  quiz: [
    { q: 'What decides that dev gets wave-demo before prod?', o: ['Alphabetical order', 'upgradeWave in the inventory plus the generator selector', 'Argo CD sync timeouts'], a: 1, why: 'The selector matches upgradeWave "0" only, until you widen it.' },
    { q: 'What happens to stable pods when a canary fails?', o: ['They are replaced anyway', 'They keep serving; only the canary is affected', 'The namespace is deleted'], a: 1, why: 'That is the point of a canary: limited blast radius.' },
    { q: 'How is a promotion recorded?', o: ['In the Argo CD UI history only', 'As a Git commit / PR', 'In a spreadsheet'], a: 1, why: 'Promotion via Git gives you review, history and one-command rollback.' }
  ],
  note: 'I would rather have two boring waves that everyone understands than a clever five-stage pipeline nobody trusts. Start with dev then prod, add waves when you have more clusters than fingers.'
},
{
  id: '09-secrets-and-identity', level: 3, title: 'Secrets and identity', time: '60 min',
  goal: 'Pull secrets from a cloud secret store with workload identity, and replace the Argo CD admin password with SSO and RBAC.',
  concepts: [
    { t: 'External Secrets Operator', d: 'An ExternalSecret says "make Secret X from key Y in store Z". Git holds the reference, never the value.' },
    { t: 'Workload identity', d: 'Pods get cloud identity from their ServiceAccount: Azure WI, IRSA / EKS Pod Identity, GKE WI. No static keys to leak.' },
    { t: 'SSO for Argo CD', d: 'OIDC against your IdP. People log in as themselves; groups map to roles.' },
    { t: 'RBAC, admin off', d: '`policy.default: role:readonly`, admins by group, and `admin.enabled: "false"` once SSO works.' }
  ],
  steps: [
    { t: 'Put a secret in the store',
      cmd: { kind: sh`# kind: no cloud store. We use ESO's fake provider in the next step.`,
        aks: sh`az keyvault secret set --vault-name "$PREFIX-kv" --name demo-db-password --value 's3cr3t'`,
        eks: sh`aws secretsmanager create-secret --name demo-db-password --secret-string 's3cr3t'`,
        gke: sh`printf 's3cr3t' | gcloud secrets create demo-db-password --data-file=-` } },
    { t: 'Create a ClusterSecretStore',
      d: 'For the real thing, commit this under addons/ so every cluster gets it via GitOps. Applying directly is fine for a first test.',
      cmd: { kind: sh`kubectl --context {DEV} apply -f - <<'EOF'
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata: { name: fleet-secrets }
spec:
  provider:
    fake:
      data:
        - key: demo-db-password
          value: s3cr3t
EOF`,
        aks: sh`kubectl --context {DEV} apply -f - <<'EOF'
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata: { name: fleet-secrets }
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://YOUR_PREFIX-kv.vault.azure.net
      serviceAccountRef: { name: external-secrets, namespace: external-secrets }
EOF`,
        eks: sh`kubectl --context {DEV} apply -f - <<'EOF'
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata: { name: fleet-secrets }
spec:
  provider:
    aws:
      service: SecretsManager
      region: YOUR_REGION
      auth:
        jwt:   # IRSA; omit auth entirely with EKS Pod Identity
          serviceAccountRef: { name: external-secrets, namespace: external-secrets }
EOF`,
        gke: sh`kubectl --context {DEV} apply -f - <<'EOF'
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata: { name: fleet-secrets }
spec:
  provider:
    gcpsm:
      projectID: YOUR_PROJECT
      auth:
        workloadIdentity:
          clusterLocation: YOUR_REGION
          clusterName: YOUR_PREFIX-dev
          serviceAccountRef: { name: external-secrets, namespace: external-secrets }
EOF` } },
    { t: 'Sync a secret into a tenant namespace',
      cmd: sh`kubectl --context {DEV} apply -f - <<'EOF'
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: db-password, namespace: product-a }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: fleet-secrets }
  target: { name: db-password }
  data:
    - secretKey: password
      remoteRef: { key: demo-db-password }
EOF
kubectl --context {DEV} -n product-a get externalsecret,secret db-password` },
    { t: 'SSO and RBAC for Argo CD (Helm values)',
      d: 'Add this to bootstrap/argocd/values-prod.yaml with your IdP details, upgrade the release, log in via SSO, and only then disable admin.',
      cmd: sh`configs:
  cm:
    url: https://argocd.example.com
    admin.enabled: "false"
    oidc.config: |
      name: SSO
      issuer: https://login.example.com
      clientID: argocd
      clientSecret: $oidc.clientSecret
      requestedScopes: ["openid", "profile", "email", "groups"]
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, platform-admins, role:admin` },
    { t: 'Remove the bootstrap password', cmd: sh`kubectl --context {HUB} -n argocd delete secret argocd-initial-admin-secret` }
  ],
  brk: { t: 'Delete the synced Secret', d: 'Someone "cleans up" the Kubernetes Secret. What happens?',
    cmd: sh`kubectl --context {DEV} -n product-a delete secret db-password
kubectl --context {DEV} -n product-a get secret db-password -w`,
    fix: 'ESO owns the Secret and recreates it from the store. The source of truth for the value is the cloud store; for the reference, Git.' },
  quiz: [
    { q: 'What does Git store for a secret in this setup?', o: ['The base64 value', 'An ExternalSecret reference to a key in the store', 'An encrypted blob'], a: 1, why: 'The value stays in the secret store. Git only knows the key name.' },
    { q: 'Why workload identity instead of an access key in a Secret?', o: ['It is faster', 'No long-lived credential to leak or rotate', 'ESO requires it'], a: 1, why: 'Short-lived tokens bound to a ServiceAccount beat static keys every time.' },
    { q: 'When is it safe to set admin.enabled: "false"?', o: ['Immediately after install', 'After SSO login works and an admin group is mapped', 'Never'], a: 1, why: 'Otherwise you can lock yourself out. Test SSO first.' }
  ],
  note: 'In the workshop, everyone wanted to start with secrets. I make people wait until module 09 on purpose: once the fleet is GitOps-driven, ESO is twenty lines of YAML. Before that, it is a snowflake per cluster.'
},
{
  id: '10-going-to-cloud', level: 3, title: 'Going to cloud', time: '90 min',
  goal: 'Provision a hub and two spokes on AKS, EKS or GKE with production-leaning defaults, and register spokes without long-lived tokens.',
  concepts: [
    { t: 'What up.sh provisions', d: 'Hub + dev + prod with autoscaling node pools, a system pool where supported, workload identity, network policy and a managed upgrade channel. Kubernetes version is a variable.' },
    { t: 'Declarative cluster Secrets', d: 'Instead of `argocd cluster add` (which mints a long-lived ServiceAccount token), the hub authenticates with its own cloud identity via `execProviderConfig`.' },
    { t: 'Per-cloud identity', d: 'AKS: Azure workload identity + kubelogin. EKS: IRSA or Pod Identity + access entries. GKE: Workload Identity + argocd-k8s-auth.' },
    { t: 'Private API endpoints', d: 'With private control planes the hub must have a network path: same VNet/VPC, peering, or a pull-based agent. Decide before you build.' }
  ],
  steps: [
    { t: 'Configure your environment',
      cmd: sh`cp bootstrap/{CLOUD}/env.example bootstrap/{CLOUD}/env
$EDITOR bootstrap/{CLOUD}/env   # PREFIX, REGION, K8S_VERSION, NODE_SIZE, NODE_COUNT_MIN/MAX, REPO_URL` },
    { t: 'Log in to your cloud',
      cmd: { aks: sh`az login
az account set --subscription YOUR_SUBSCRIPTION_ID`,
        eks: sh`aws sso login --profile YOUR_PROFILE   # or: aws configure
export AWS_PROFILE=YOUR_PROFILE`,
        gke: sh`gcloud auth login
gcloud config set project YOUR_PROJECT`,
        kind: sh`az login   # showing AKS; pick EKS or GKE in the track switcher` } },
    { t: 'Dry run first', d: 'Read every command it will run. This is the part people skip and then regret.',
      cmd: sh`bash bootstrap/{CLOUD}/up.sh --dry-run | less` },
    { t: 'Create the fleet', cmd: sh`bash bootstrap/{CLOUD}/up.sh` },
    { t: 'Verify contexts, registration and inventory',
      cmd: sh`kubectl config get-contexts | grep fleet-
kubectl --context fleet-hub -n argocd get secrets \
  -l argocd.argoproj.io/secret-type=cluster --show-labels
git diff clusters/ && git commit -am "Inventory: {CLOUD} fleet" && git push` },
    { t: 'Tear down when you are done', d: 'Clusters bill by the hour. Git keeps everything you need to rebuild.',
      cmd: sh`bash bootstrap/{CLOUD}/down.sh` }
  ],
  brk: { t: 'Revoke the hub\'s access to a spoke', d: 'Remove the hub identity\'s access to fleet-dev (role assignment, access entry or IAM binding, depending on cloud). Then look at what Argo CD reports.',
    cmd: sh`argocd cluster list
kubectl --context fleet-hub -n argocd get applications | grep '^dev-'`,
    fix: 'dev apps go Unknown with an auth error, prod keeps working. Restore the binding by re-running up.sh (it is idempotent where practical). Identity is now part of your fleet config; treat it like code.' },
  quiz: [
